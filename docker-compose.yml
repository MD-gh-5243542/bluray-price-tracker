services:
  bluray-tracker:
    build: .
    # or, once published:  image: ghcr.io/<you>/bluray-price-tracker:latest
    container_name: bluray-tracker
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    shm_size: 1gb          # Chromium needs more than Docker's 64 MB default
    restart: unless-stopped
    environment:
      TZ: Australia/Sydney
      SCHEDULED_CHECKS: "true"
      REQUEST_DELAY: "2.5"
      # Alerts via Apprise — comma separated. Examples:
      #   ntfy://ntfy.sh/my-secret-bluray-topic
      #   discord://webhook_id/webhook_token
      #   tgram://bot_token/chat_id
      APPRISE_URLS: ""
      # Optional WhatsApp restock alerts via WAHA on a shared Docker network.
      # Configure in .env, then enable alerts in Settings.
      WAHA_URL: "${WAHA_URL:-}"
      WAHA_SESSION: "${WAHA_SESSION:-default}"
      WAHA_CHAT_ID: "${WAHA_CHAT_ID:-}"
      WAHA_API_KEY: "${WAHA_API_KEY:-}"
      CEX_STOCK_ALERTS: "${CEX_STOCK_ALERTS:-false}"
      CEX_ALERT_LOCATIONS: "${CEX_ALERT_LOCATIONS:-Blacktown,Rouse Hill,online}"
      # Used for links in alerts, e.g. http://docker-host:8000
      BASE_URL: ""
      # Delivery estimates (AUD) added to retailer prices
      SHIPPING_EZYDVD: "6.95"
      FREE_SHIPPING_OVER_EZYDVD: "80"
      SHIPPING_AMAZON: "0"
      SHIPPING_JBHIFI: "6.95"
      FREE_SHIPPING_OVER_JBHIFI: "99"
      # Estimates: Umbrella rates vary by weight/destination; it advertises free AU shipping over $120.
      SHIPPING_UMBRELLA: "9.95"
      FREE_SHIPPING_OVER_UMBRELLA: "120"
      # DVD Hub standard tracked postage rate.
      SHIPPING_DVDHUB: "7.95"
      FREE_SHIPPING_OVER_DVDHUB: "0"
      # Sanity: $3.50 for one item, $9.95 for multiple items, free over $120.
      SHIPPING_SANITY: "3.50"
      SHIPPING_SANITY_MULTI: "9.95"
      FREE_SHIPPING_OVER_SANITY: "120"
      # Rarewaves rate varies by destination and basket.
      SHIPPING_RAREWAVES: "9.95"
      FREE_SHIPPING_OVER_RAREWAVES: "0"
